<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <a href="index.html" class="back-home-btn">← BACK</a>


    <style>
    body, html {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #faf6f6;
        cursor: url('cursor-focus.png') 16 16, auto; /* Спокійний стан — зелений */
    }
    
    .back-home-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 0.8rem 1.5rem;
        background-color: #fff5f5;
        color: #7C4C4C;
        border: 4px solid #7C4C4C;
        font-family: sans-serif;
        font-weight: bold;
        text-decoration: none;
        z-index: 9999;
        cursor: url('cursor-focus.png') 16 16, pointer;
        transition: transform 0.1s ease;
    }
    
    .back-home-btn:hover {
        transform: translateY(-2px);
        background-color: #7C4C4C;
        color: white;
    }

    /* 👇 ОНОВЛЕНО: ДОДАНО МАГІЮ КЛІКУ 👇 */
    body:active, .back-home-btn:active {
        cursor: url('cursor-click.png') 16 16, auto; /* Стан кліку — шоколадний */
    }
</style>


    <script src="https://cloudflare.com"></script>

</body>
</html>
